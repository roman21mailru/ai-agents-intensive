[project]
name = "ai-python-workshop-linksvc"
version = "0.1.0"
description = "Production Link Service with AI Engineering Harness"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]==0.139.2",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.30.0",
    "psycopg[binary]==3.3.4",
    "alembic==1.18.5",
    "pydantic-settings==2.14.2",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "aiosqlite==0.22.1",
    "ruff==0.16.0",
    "basedpyright==1.39.9",
    "pre-commit==4.6.1",
    "bandit[toml]==1.9.4",
    "pip-audit==2.10.1",
    "locust==2.46.2",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv", "alembic/versions", ".agents"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ANN", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "E501", "F841", "SIM"]
"agent-battle/**" = ["S101", "ANN", "E501"]
"tools/**" = ["ANN", "E501", "E402", "B904", "F841", "SIM", "RUF"]
"scripts/**" = ["ANN", "E501", "SIM", "RUF"]
"alembic/**" = ["ANN", "F401", "E501", "I001"]
"locustfile.py" = ["ANN"]
"spikes/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
exclude = [".venv/**", "alembic/**", "tests/**", "tools/**", "locustfile.py", "spikes/**"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests", "agent-battle"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["alembic/*", "tests/*", "agent-battle/*"]

[tool.coverage.report]
fail_under = 50
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = ["B101"]
